<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Sunrise gradient background circle -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#sky)"/>
  <!-- Sun rising from horizon -->
  <circle cx="24" cy="28" r="9" fill="url(#sun)"/>
  <!-- Horizon line -->
  <rect x="4" y="28" width="40" height="16" rx="4" fill="url(#sky)"/>
  <!-- Cloud -->
  <ellipse cx="20" cy="20" rx="8" ry="5" fill="white" opacity="0.95"/>
  <ellipse cx="26" cy="18" rx="6" ry="4.5" fill="white" opacity="0.95"/>
  <ellipse cx="15" cy="21" rx="5" ry="3.5" fill="white" opacity="0.9"/>
  <!-- Arrow pointing up-right (tomorrow/forward) -->
  <path d="M28 36l5-5m0 0l-3.5 0m3.5 0l0 3.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
