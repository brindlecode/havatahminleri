name: Production health check

# An independent watchdog on the LIVE site.
#
# build-deploy.yml can only report a failure when it runs. Between 2026-07-14
# and 2026-08-23 it did not run at all - GitHub had disabled the schedule after
# 60 days of repository inactivity - so there was no failure to report, and the
# site quietly served five-week-old forecasts labelled "Bugün".
#
# This workflow exists so that the *symptom* is detected even when the whole
# build pipeline is gone: it fetches real pages from yarinhava.com and fails if
# the forecast on them is not current.
#
# It cannot protect itself from the same 60-day deactivation, which is why
# build-deploy.yml still pushes a weekly keep-alive commit (repository activity
# re-arms every schedule in the repo, including this one).

on:
  schedule:
    # 06:00, 12:00 and 18:00 UTC = 09:00, 15:00, 21:00 Turkey. The forecast is
    # rebuilt once a day just after midnight Turkey time (the backup build
    # runs at 05:30), so these probes never fire in the window between
    # midnight and the daily deploy - the old 03:00 UTC probe failed almost
    # every morning for that reason alone, and the resulting noise hid the
    # real outage of September 2026.
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL to check'
        required: false
        default: 'https://yarinhava.com'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The input goes through env, never straight into the shell line.
      # 30h: one daily build plus GitHub's scheduling delay.
      - name: Probe production
        env:
          BASE_URL: ${{ inputs.base || 'https://yarinhava.com' }}
        run: node scripts/smoke-test.mjs --base "$BASE_URL" --max-age-hours 30

      - name: Close the stale-production issue once healthy
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'production-stale',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Resolved: health check ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} passed.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      - name: Open an issue when production is unhealthy
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Production health check failed - yarinhava.com may be serving stale forecasts';
            const body = [
              `@${context.repo.owner} the live site failed its health check.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The live site failed at least one health check. The most likely causes, in order:',
              '',
              '1. **The scheduled build stopped running.** Open the Actions tab and confirm',
              '   `Build & Deploy` has a run in the last 24 hours. GitHub disables cron',
              '   schedules after 60 days of repository inactivity.',
              '2. **The build ran but refused to deploy** because the forecast data was stale',
              '   or coverage was too low - check that run\'s logs.',
              '3. **The deploy did not reach Netlify** - check app.netlify.com/projects/yarinhava.',
              '',
              'Until this is fixed the site is showing past dates as "Bugün", which is what',
              'preceded the ~75% organic traffic loss in August 2026.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-stale',
            });

            // One comment per day at most: three probes a day on a known outage
            // would otherwise bury the issue in identical comments again.
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              const updated = new Date(issue.updated_at).getTime();
              if (Date.now() - updated < 20 * 3600 * 1000 && issue.comments > 0) {
                core.info('Issue already updated in the last 20 hours - not commenting again.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['production-stale'],
              });
            }
