name: Regenerate district coordinates

# Replaces district/province coordinates with real GeoNames data and commits
# the result back to the branch it ran on. Used once (September 2026) to
# remove the random coordinates; kept, manual-only, so the data can be
# regenerated reproducibly (e.g. when a new district is added).
#
# NOTE: it re-derives coordinates from the CURRENT data files; the report's
# "moved" column is then relative to the already-corrected points.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download GeoNames Turkey dump
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/geo"
          cd "$RUNNER_TEMP/geo"
          curl -fsSL -o TR.zip https://download.geonames.org/export/dump/TR.zip
          curl -fsSL -o admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
          unzip -o -q TR.zip TR.txt
          wc -l TR.txt

      - name: Regenerate coordinates
        run: node scripts/geocode-districts.mjs "$RUNNER_TEMP/geo" --report docs/district-coordinates.md

      - name: Commit the result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/districts.json docs/district-coordinates.md
          if git diff --cached --quiet; then
            echo "No coordinate changes."
            exit 0
          fi
          git commit -m "fix(data): real district coordinates from GeoNames" -m "Generated by scripts/geocode-districts.mjs; see docs/district-coordinates.md."
          git push origin "HEAD:${GITHUB_REF_NAME}"
