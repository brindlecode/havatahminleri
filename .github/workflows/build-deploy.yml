name: Build & Deploy

# NOTE: This file was renamed from scheduled-build.yml on purpose.
# GitHub disables scheduled workflows after 60 days without repository
# activity, and a workflow in that state can only be re-activated manually.
# Renaming the file registered a brand new (active) workflow, and the
# keep-alive step below stops the 60-day timer from ever expiring again.
#
# That is exactly how the site broke: the last commit before the incident was
# 2026-05-15, the schedule was switched off around 2026-07-14, and the site
# then served the 2026-07-15 forecast labelled "Bugün" until 2026-08-23.
#
# Two independent safety nets now exist:
#   1. This pipeline refuses to deploy stale or degraded data (fetch-weather
#      exits non-zero, validate-build gates the upload) and opens an issue on
#      any failure.
#   2. .github/workflows/health-check.yml probes the LIVE site on its own
#      schedule, so a pipeline that stops running entirely is still caught.

on:
  push:
    branches:
      - claude/weather-forecast-site-JpQxB
  schedule:
    # 03:00 UTC = 06:00 Turkey. GitHub delays scheduled runs under load - the
    # observed lag on this repo is 1.5-4.5 hours - so treat these as "morning"
    # and "evening" rather than exact times. health-check.yml is what enforces
    # the actual freshness SLA.
    - cron: '0 3 * * *'
    # 17:00 UTC = 20:00 Turkey.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests are cheap and catch the class of bug that shipped a
      # "15 Günlük" page rendering 16 days.
      - name: Run tests
        run: npm test

      # Exits non-zero if the API is unreachable AND no cache covers today, or
      # if fewer than 50% of locations have current data.
      - name: Fetch weather data
        run: node scripts/fetch-weather.mjs

      - name: Build site
        run: npx astro build

      # Last gate before the upload. Checks page count, sitemap integrity,
      # canonicals, JSON-LD, per-period day counts and - most importantly -
      # that the forecast dates rendered into the HTML start today.
      - name: Validate build
        run: node scripts/validate-build.mjs

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist --message "Deploy from GitHub Actions (${{ github.run_id }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # A green build that never reached production is still an outage. Give
      # Netlify's CDN a moment to propagate, then check the real thing.
      - name: Wait for propagation
        run: sleep 45

      - name: Smoke test production
        run: node scripts/smoke-test.mjs

      # GitHub deactivates cron schedules after 60 days of repository
      # inactivity. A small commit at most once a week keeps the repository
      # "active" so the schedule above never gets switched off. Pushes made
      # with GITHUB_TOKEN do not re-trigger workflows, so this cannot loop.
      #
      # This is no longer `continue-on-error`: a keep-alive that quietly stops
      # working is the exact failure that caused the incident, so it now fails
      # the job and opens an issue.
      - name: Keep schedule alive
        if: github.ref_name == 'claude/weather-forecast-site-JpQxB'
        env:
          STAMP_FILE: .github/last-build.txt
          MAX_AGE_SECONDS: 604800 # 7 days
          HARD_LIMIT_SECONDS: 3888000 # 45 days - well inside GitHub's 60-day cutoff
        run: |
          set -euo pipefail
          last=0
          if [ -f "$STAMP_FILE" ]; then
            last=$(date -u -d "$(head -n1 "$STAMP_FILE")" +%s 2>/dev/null || echo 0)
          fi
          now=$(date -u +%s)
          age=$(( now - last ))

          if [ "$age" -ge "$HARD_LIMIT_SECONDS" ]; then
            echo "::error::Keep-alive stamp is ${age}s old (>45 days). The cron schedule is close to being disabled by GitHub."
          fi

          if [ "$age" -lt "$MAX_AGE_SECONDS" ]; then
            echo "Keep-alive stamp is ${age}s old - nothing to do."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP_FILE"
          git commit -m "chore: keep-alive stamp so the build schedule stays enabled"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Keep-alive stamp pushed."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) - rebasing and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $(( attempt * 5 ))
          done
          echo "::error::Could not push the keep-alive stamp - the cron schedule will expire 60 days from the last commit."
          exit 1

      # Fail loudly. A scheduled workflow that fails silently is invisible:
      # nobody watches the Actions tab, and that is why five weeks of stale
      # forecasts went unnoticed.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Build & Deploy failed - production may be serving stale forecasts';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Trigger: \`${context.eventName}\``,
              '',
              'The scheduled forecast build did not complete. Production is still serving the previous deploy,',
              'which will start showing past dates as "Bugün" if this is not fixed within ~24 hours.',
              '',
              'Check, in order:',
              '1. `Fetch weather data` - Open-Meteo unreachable or rate limiting.',
              '2. `Validate build` - the build produced stale or structurally broken pages.',
              '3. `Smoke test production` - the deploy did not reach the CDN.',
              '4. `Keep schedule alive` - the cron schedule is at risk of being disabled by GitHub.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            }
