name: Build & Deploy

on:
  schedule:
    # 06:00 Turkey time (UTC+3)
    - cron: '0 3 * * *'
    # 20:00 Turkey time (UTC+3)
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch weather data
        run: node scripts/fetch-weather.mjs

      - name: Build site
        run: npx astro build

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
