# The site is built and deployed by GitHub Actions
# (.github/workflows/build-deploy.yml), which uploads dist/ with netlify-cli.
#
# Netlify also starts its own build on every push, and that build has nothing
# to run: the command below is a no-op, so no dist/ is produced and the build
# fails with "Deploy directory 'dist' does not exist". The `ignore` command
# stops it before it starts — exit code 0 means "skip this build" — so pushes
# no longer raise failed builds. It has no effect on the CLI deploy from
# GitHub Actions, which uploads files directly without a Netlify build.
[build]
  ignore = "exit 0"
  command = "echo 'Build handled by GitHub Actions'"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=1800, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://*.githubusercontent.com; connect-src 'self' https://api.github.com https://api.open-meteo.com https://api.netlify.com; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
